<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ram Street Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<style>
  :root {
    --bg: #FDFAF4;
    --bg-page: #F2EDE0;
    --bg-hover: #EAE4D4;
    --border: #DDD7C8;
    --border-strong: #C8C1AF;
    --text: #1A1A18;
    --text-2: #6B6559;
    --text-3: #9C9484;
    --green: #1C3828;
    --green-hover: #142A1E;
    --green-light: #E8EFE9;
    --red: #C0392B;
    --red-light: #FAEAE8;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg-page);
    color: var(--text);
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    font-size: 14px; line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  #app { min-height: 100vh; }

  /* ---- View-only mode ---- */
  body.view-only .del-btn,
  body.view-only .chip-x,
  body.view-only .upload-btn,
  body.view-only .db-footer,
  body.view-only .add-member-row,
  body.view-only .rm-btn { display: none !important; }
  body.view-only input,
  body.view-only textarea,
  body.view-only select { pointer-events: none; cursor: default; }

  /* ---- Header ---- */
  .site-header {
    position: sticky; top: 0; z-index: 100;
    background: var(--green);
    border-bottom: 1px solid #142A1E;
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 40px; height: 52px;
  }
  .site-logo { font-size: 15px; font-weight: 700; color: #FFFFFF; letter-spacing: 0.3px; user-select: none; }
  .site-logo em { color: #A8C5A0; font-style: normal; }
  .header-right { display: flex; align-items: center; gap: 10px; }
  .save-badge { font-size: 12px; color: #A8C5A0; min-height: 16px; }
  .header-btn {
    font-family: 'Inter', sans-serif; font-size: 12px; font-weight: 500;
    border: 1px solid rgba(255,255,255,0.2); border-radius: 6px; padding: 5px 12px;
    cursor: pointer; background: rgba(255,255,255,0.08); color: rgba(255,255,255,0.75);
    transition: background 0.1s, color 0.1s;
  }
  .header-btn:hover { background: rgba(255,255,255,0.15); color: #fff; }
  .header-btn-unlock { background: rgba(168,197,160,0.2); color: #A8C5A0; border-color: rgba(168,197,160,0.4); font-weight: 600; }
  .header-btn-unlock:hover { background: rgba(168,197,160,0.3); color: #C5DFC0; }

  /* ---- Layout ---- */
  .page-wrap { max-width: 1060px; margin: 0 auto; padding: 36px 40px 80px; }

  /* ---- Nav tabs ---- */
  .nav-tabs { display: flex; border-bottom: 1px solid var(--border); margin-bottom: 28px; }
  .nav-tab {
    font-family: 'Inter', sans-serif; font-size: 13px; font-weight: 500;
    color: var(--text-2); border: none; background: none;
    padding: 10px 16px; cursor: pointer;
    border-bottom: 2px solid transparent; margin-bottom: -1px;
    border-radius: 4px 4px 0 0; transition: color 0.1s, background 0.1s;
  }
  .nav-tab:hover { color: var(--text); background: var(--bg-hover); }
  .nav-tab.active { color: var(--text); border-bottom-color: var(--green); font-weight: 600; }
  .nav-tab-alumni { color: #3A6B50; }
  .nav-tab-alumni.active { border-bottom-color: var(--green); }

  /* ---- Month chips ---- */
  .month-bar { display: flex; gap: 4px; flex-wrap: wrap; margin-bottom: 22px; }
  .month-chip {
    font-family: 'Inter', sans-serif; font-size: 12px; font-weight: 500;
    color: var(--text-2); background: var(--bg); border: 1px solid var(--border);
    border-radius: 6px; padding: 5px 10px; cursor: pointer;
    transition: background 0.1s, color 0.1s, border-color 0.1s;
  }
  .month-chip:hover { background: var(--bg-hover); color: var(--text); border-color: var(--border-strong); }
  .month-chip.active { background: var(--green); color: #fff; border-color: var(--green); }
  .month-chip .n { font-size: 11px; opacity: 0.7; margin-left: 3px; }

  /* ---- Page header ---- */
  .page-header { margin-bottom: 18px; }
  .page-title { font-size: 22px; font-weight: 700; color: var(--text); letter-spacing: -0.4px; margin-bottom: 2px; }
  .page-sub { font-size: 13px; color: var(--text-2); }

  /* ---- Notice ---- */
  .notice-wrap {
    background: var(--bg-hover); border-radius: 8px;
    padding: 10px 14px; margin-bottom: 16px;
    display: flex; align-items: flex-start; gap: 8px;
  }
  .notice-icon { font-size: 14px; padding-top: 1px; flex-shrink: 0; line-height: 1.5; }
  .notice-wrap textarea {
    flex: 1; border: none; background: transparent;
    font-family: 'Inter', sans-serif; font-size: 13px; color: var(--text);
    resize: none; min-height: 20px; outline: none; line-height: 1.5;
  }

  /* ---- Database table ---- */
  .db-wrap { background: var(--bg); border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }
  .grid-row { display: grid; align-items: center; }
  .grid-row.entry > * { min-width: 0; }
  .grid-row.schedule   { grid-template-columns: 26px 1.2fr 1fr 170px 1fr 130px 30px; }
  .grid-row.docs       { grid-template-columns: 26px 1.3fr 1.6fr 30px; }
  .grid-row.references { grid-template-columns: 26px 1fr 1fr 1fr 1fr 30px; }
  .grid-row.alumni     { grid-template-columns: 26px 1.5fr 65px 1.1fr 1.1fr 1.2fr 1.3fr 30px; }
  .grid-row.head {
    background: var(--bg-page); border-bottom: 1px solid var(--border);
    font-size: 11px; font-weight: 600; color: var(--text-3);
    text-transform: uppercase; letter-spacing: 0.5px; padding: 9px 14px;
  }
  .grid-row.entry { border-bottom: 1px solid var(--border); padding: 5px 14px; transition: background 0.08s; }
  .grid-row.entry:last-of-type { border-bottom: none; }
  .grid-row.entry:hover { background: var(--bg-page); }
  .grid-row.references.entry { align-items: start; padding-top: 10px; padding-bottom: 10px; }
  .grid-row .idx { font-size: 11px; color: var(--text-3); cursor: help; }

  .member-cell { display: flex; align-items: center; gap: 7px; }
  .member-name-locked { font-size: 13px; color: var(--text); }
  .due-cell { display: flex; align-items: center; gap: 2px; position: relative; min-width: 0; overflow: hidden; }
  .due-cell input { min-width: 0; flex-shrink: 1; }
  .avatar {
    flex-shrink: 0; width: 24px; height: 24px; border-radius: 6px;
    display: flex; align-items: center; justify-content: center;
    font-size: 9px; font-weight: 700; color: #fff; font-family: 'Inter', sans-serif;
  }

  .grid-row input, .grid-row textarea {
    font-family: 'Inter', sans-serif; font-size: 13px; color: var(--text);
    border: none; background: transparent; padding: 7px 6px;
    outline: none; width: 100%; border-radius: 6px;
  }
  .grid-row input:focus, .grid-row textarea:focus { background: var(--green-light); }
  textarea.auto-text { resize: none; overflow: hidden; line-height: 1.45; min-height: 34px; white-space: pre-wrap; }

  .article-cell { display: flex; align-items: center; gap: 5px; overflow: hidden; }
  .upload-btn {
    font-family: 'Inter', sans-serif; font-size: 12px; font-weight: 500;
    color: var(--text-2); background: var(--bg-page); border: 1px solid var(--border);
    padding: 4px 10px; border-radius: 6px; cursor: pointer; white-space: nowrap;
    transition: background 0.1s, border-color 0.1s;
  }
  .upload-btn:hover { background: var(--bg-hover); border-color: var(--border-strong); color: var(--text); }
  .file-chip {
    font-family: 'Inter', sans-serif; font-size: 12px; font-weight: 500;
    color: var(--text); background: var(--bg-page); border: 1px solid var(--border);
    padding: 4px 10px; border-radius: 6px; cursor: pointer;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    max-width: 140px; text-decoration: none; display: inline-block;
    transition: background 0.1s;
  }
  .file-chip:hover { background: var(--bg-hover); }
  .file-chip.link-chip { color: var(--green); background: var(--green-light); border-color: transparent; }
  .file-chip.link-chip:hover { background: #d5ede1; }
  .chip-x {
    background: none; border: none; color: var(--text-3); font-size: 14px;
    cursor: pointer; padding: 2px 4px; flex-shrink: 0; border-radius: 4px; line-height: 1;
    transition: color 0.1s, background 0.1s;
  }
  .chip-x:hover { color: var(--red); background: var(--red-light); }
  .chip-x.link-alt { font-size: 11px; text-decoration: underline; color: var(--text-3); white-space: nowrap; }
  .chip-x.link-alt:hover { background: none; color: var(--text); }

  .status-pill {
    font-family: 'Inter', sans-serif; font-size: 11px; font-weight: 600;
    padding: 4px 8px; border-radius: 6px; border: none; cursor: pointer; white-space: nowrap;
    appearance: none; -webkit-appearance: none; -moz-appearance: none;
  }
  .status-pill option { color: #37352F; background: #fff; font-family: 'Inter', sans-serif; }

  .del-btn {
    background: none; border: none; color: var(--border-strong);
    font-size: 16px; cursor: pointer; padding: 4px; border-radius: 4px; line-height: 1;
    transition: color 0.1s, background 0.1s;
  }
  .del-btn:hover { color: var(--red); background: var(--red-light); }

  .db-footer { padding: 10px 14px; }
  .add-btn {
    background: none; border: none; color: var(--text-3);
    font-family: 'Inter', sans-serif; font-size: 13px; font-weight: 500;
    cursor: pointer; padding: 6px 8px; border-radius: 6px;
    transition: background 0.1s, color 0.1s;
  }
  .add-btn:hover { background: var(--bg-hover); color: var(--text); }

  .empty-row { padding: 44px 0; text-align: center; color: var(--text-3); font-size: 13px; }

  /* ---- Roster ---- */
  .roster-grid { display: flex; flex-wrap: wrap; gap: 8px; }
  .roster-card {
    display: flex; align-items: center; gap: 8px;
    background: var(--bg); border: 1px solid var(--border);
    border-radius: 8px; padding: 8px 10px; font-size: 13px; font-weight: 500;
  }
  .rm-btn {
    background: none; border: none; color: var(--text-3);
    cursor: pointer; font-size: 14px; padding: 0 2px; line-height: 1;
    border-radius: 4px; transition: color 0.1s;
  }
  .rm-btn:hover { color: var(--red); }
  .add-member-row { display: flex; gap: 8px; align-items: center; margin-top: 18px; }
  .add-member-input {
    border: 1px solid var(--border); border-radius: 7px; padding: 8px 12px;
    font-size: 13px; font-family: 'Inter', sans-serif; outline: none; width: 200px;
    background: var(--bg); color: var(--text); transition: border-color 0.1s;
  }
  .add-member-input:focus { border-color: var(--green); }
  .add-member-btn {
    background: var(--green); color: #fff; border: none; border-radius: 7px;
    padding: 8px 14px; font-size: 13px; font-weight: 600;
    cursor: pointer; font-family: 'Inter', sans-serif; transition: background 0.1s;
  }
  .add-member-btn:hover { background: var(--green-hover); }
  .ghost-btn {
    background: var(--bg); border: 1px solid var(--border); border-radius: 7px;
    padding: 8px 14px; font-size: 13px; font-weight: 500; color: var(--text-2);
    cursor: pointer; font-family: 'Inter', sans-serif; transition: background 0.1s, color 0.1s;
  }
  .ghost-btn:hover { background: var(--bg-hover); color: var(--text); }

  /* ---- Alumni banner ---- */
  .alumni-banner {
    background: var(--green-light); border: 1px solid #C2D4C4;
    border-radius: 8px; padding: 12px 16px; margin-bottom: 16px;
    font-size: 13px; color: #2A5038; display: flex; align-items: center; gap: 8px;
  }

  /* ---- Standing meeting card ---- */
  .standing-card {
    background: var(--bg); border: 1px solid var(--border);
    border-radius: 10px; padding: 16px 20px; margin-bottom: 20px;
  }
  .standing-header {
    display: flex; align-items: center; gap: 8px; margin-bottom: 14px;
  }
  .standing-badge {
    font-size: 11px; font-weight: 700; letter-spacing: 0.5px; text-transform: uppercase;
    color: var(--green); background: var(--green-light); border-radius: 6px; padding: 3px 9px;
  }
  .standing-fields {
    display: grid; grid-template-columns: 1.2fr 0.8fr 1.4fr 1.4fr; gap: 12px;
  }
  .standing-field-label {
    font-size: 11px; font-weight: 600; color: var(--text-3);
    text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 5px;
  }
  .standing-input {
    font-family: 'Inter', sans-serif; font-size: 13px; color: var(--text);
    border: none; background: var(--bg-page); padding: 7px 10px;
    border-radius: 6px; width: 100%; outline: none; transition: background 0.1s;
  }
  .standing-input:focus { background: var(--green-light); }

  /* ---- Event cards ---- */
  .events-list { display: flex; flex-direction: column; gap: 8px; margin-bottom: 8px; }
  .event-card {
    background: var(--bg); border: 1px solid var(--border); border-radius: 10px;
    padding: 14px 16px; display: grid;
    grid-template-columns: 60px 1fr 30px; gap: 14px; align-items: start;
    transition: background 0.08s;
  }
  .event-card:hover { background: var(--bg-hover); }
  .event-card.event-past { opacity: 0.4; }
  .event-date-badge { text-align: center; padding-top: 3px; }
  .event-date-month {
    font-size: 10px; font-weight: 700; text-transform: uppercase;
    letter-spacing: 0.5px; color: var(--green); line-height: 1.4;
  }
  .event-date-day { font-size: 26px; font-weight: 700; color: var(--text); line-height: 1; }
  .event-date-empty { font-size: 11px; color: var(--text-3); padding-top: 6px; }
  .event-body { display: flex; flex-direction: column; gap: 3px; }
  .event-title-input {
    font-family: 'Inter', sans-serif; font-size: 14px; font-weight: 600;
    color: var(--text); border: none; background: transparent;
    padding: 2px 4px; border-radius: 4px; width: 100%; outline: none;
  }
  .event-title-input:focus { background: var(--green-light); }
  .event-title-input::placeholder { font-weight: 500; color: var(--text-3); }
  .event-meta-row { display: flex; gap: 4px; flex-wrap: wrap; }
  .event-meta-input {
    font-family: 'Inter', sans-serif; font-size: 12px; color: var(--text-2);
    border: none; background: transparent; padding: 2px 4px;
    border-radius: 4px; outline: none; min-width: 80px;
  }
  .event-meta-input:focus { background: var(--green-light); }
  .event-desc-input {
    font-family: 'Inter', sans-serif; font-size: 12px; color: var(--text-2);
    border: none; background: transparent; padding: 2px 4px; border-radius: 4px;
    width: 100%; outline: none; resize: none; line-height: 1.45; min-height: 20px;
    white-space: pre-wrap; overflow: hidden;
  }
  .event-desc-input:focus { background: var(--green-light); }
  .event-link-input {
    font-family: 'Inter', sans-serif; font-size: 12px; color: #3A6B50;
    border: none; background: transparent; padding: 2px 4px;
    border-radius: 4px; width: 100%; outline: none;
  }
  .event-link-input:focus { background: var(--green-light); }
  .events-section-label {
    font-size: 11px; font-weight: 600; color: var(--text-3);
    text-transform: uppercase; letter-spacing: 0.5px;
    margin: 20px 0 8px;
  }
  .events-section-label:first-child { margin-top: 0; }

  .loading { text-align: center; padding: 120px 0; color: var(--text-3); font-size: 13px; }

  @media (max-width: 820px) {
    .site-header { padding: 0 16px; }
    .page-wrap { padding: 20px 16px 60px; }
    .grid-row.schedule   { grid-template-columns: 20px 1fr 1fr 130px 90px 100px 24px; font-size: 12px; }
    .grid-row.docs       { grid-template-columns: 18px 1fr 1fr 24px; font-size: 12px; }
    .grid-row.references { grid-template-columns: 18px 1fr 1fr 1fr 1fr 24px; font-size: 12px; }
    .grid-row.alumni     { grid-template-columns: 18px 1fr 50px 1fr 1fr 24px; font-size: 12px; }
  }
</style>
</head>
<body>
<div id="app"><div class="loading">Loading…</div></div>
<script>
// ===== FIREBASE CONFIG =====
const firebaseConfig = {
  apiKey: "AIzaSyBbt0q-wjdsKQ9eS0wjJWC7eBvDBhQvx4k",
  authDomain: "ramstreet-c2350.firebaseapp.com",
  projectId: "ramstreet-c2350",
  storageBucket: "ramstreet-c2350.firebasestorage.app",
  messagingSenderId: "450707565730",
  appId: "1:450707565730:web:3638ca27fd0788899c3bfb"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
const metaRef      = db.collection('ramstreet-meta').doc('main');
const entriesCol   = db.collection('ramstreet-entries');
const docsCol      = db.collection('ramstreet-docs-tab');
const referencesCol = db.collection('ramstreet-references');
const alumniCol    = db.collection('ramstreet-alumni');
const eventsCol    = db.collection('ramstreet-events');
const legacyRef    = db.collection('ramstreet').doc('schedule-data');

const MAX_UPLOAD_BYTES = 350 * 1024;
const AVATAR_COLORS = ['#2D6A4F','#B45309','#C2410C','#1D4ED8','#7C3AED','#BE185D'];
const DEFAULT_MEMBERS = [
  "Conner Pietrangelo","Charlie Green","Jacob Gaer","Sophia Paul","Chris Terringo",
  "Hunter Folga","Natalie Sarff","Paytyn Newton","Raymond Kappel","Tim Kervin",
  "Robert Duquette","Spencer Graham","Michael Melander","Hunter Stewart","Hollis Costa",
  "Madison Lehman","Celine Jamnik","Emma Winters"
];
const MONTHS = [
  { key: '2026-09', label: 'Sep', year: 2026 },
  { key: '2026-10', label: 'Oct', year: 2026 },
  { key: '2026-11', label: 'Nov', year: 2026 },
  { key: '2026-12', label: 'Dec', year: 2026 },
  { key: '2027-01', label: 'Jan', year: 2027 },
  { key: '2027-02', label: 'Feb', year: 2027 },
  { key: '2027-03', label: 'Mar', year: 2027 },
  { key: '2027-04', label: 'Apr', year: 2027 },
  { key: '2027-05', label: 'May', year: 2027 },
];

let state = {
  notice: 'Welcome! Add your topic, due date, and article link below.',
  members: DEFAULT_MEMBERS.slice(),
  entries: [], docs: [], references: [], alumni: [], events: [],
  standingMeeting: { day: '', time: '', location: '', note: '' },
  passcode: ''
};
let activeSection = 'schedule';
let activeMonth = defaultMonth();
let isUnlocked = false;

const app = document.getElementById('app');

function defaultMonth() {
  const now = new Date();
  const key = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}`;
  return MONTHS.find(m => m.key === key) ? key : MONTHS[0].key;
}
function monthKeyOf(dueStr) { return dueStr ? dueStr.slice(0, 7) : null; }
function escAttr(str) { return (str || '').replace(/"/g, '&quot;'); }
function escJs(str) { return (str || '').replace(/\\/g, '\\\\').replace(/'/g, "\\'"); }
function escHtml(str) { const d = document.createElement('div'); d.textContent = str || ''; return d.innerHTML; }
function autoResizeTextarea(el) { el.style.height = 'auto'; el.style.height = el.scrollHeight + 'px'; }
function formatRelative(ts) {
  if (!ts || !ts.toDate) return '';
  const diffMs = Date.now() - ts.toDate().getTime();
  const mins = Math.round(diffMs / 60000);
  if (mins < 1) return 'Last edited just now';
  if (mins < 60) return `Last edited ${mins}m ago`;
  const hrs = Math.round(mins / 60);
  if (hrs < 24) return `Last edited ${hrs}h ago`;
  return `Last edited ${Math.round(hrs / 24)}d ago`;
}
function initials(name) {
  const parts = (name || '').trim().split(/\s+/).filter(Boolean);
  if (!parts.length) return '?';
  return ((parts[0][0] || '') + (parts.length > 1 ? parts[parts.length-1][0] : '')).toUpperCase();
}
function avatarColorFor(name) {
  if (!name) return '#9B9A97';
  let hash = 0;
  for (let i = 0; i < name.length; i++) hash = (hash * 31 + name.charCodeAt(i)) % 997;
  return AVATAR_COLORS[Math.abs(hash) % AVATAR_COLORS.length];
}
function avatarHtml(name) {
  return `<span class="avatar" style="background:${avatarColorFor(name)}">${escHtml(initials(name))}</span>`;
}

const STATUS_DEFS = [
  { key: 'not_started', label: 'Not Started', bg: '#F0EFEE', fg: '#787672' },
  { key: 'in_progress', label: 'In Progress', bg: '#FFF3CD', fg: '#795C00' },
  { key: 'done_writing', label: 'Done Writing', bg: '#FFE8D6', fg: '#7B3F00' },
  { key: 'editing',     label: 'Editing',      bg: '#E3F2FA', fg: '#1A5F7A' },
  { key: 'published',   label: 'Published',    bg: '#EDF6F1', fg: '#2D6A4F' },
];
function statusMeta(key) { return STATUS_DEFS.find(s => s.key === key) || STATUS_DEFS[0]; }
function effectiveStatus(e) { return e.status || (e.posted ? 'published' : 'not_started'); }

/* ---------- Passcode / lock ---------- */
function unlockPrompt() {
  if (!state.passcode) { alert('Passcode not set up yet — try again in a moment.'); return; }
  const entered = prompt('Enter the club passcode:');
  if (entered === null) return;
  if (entered.trim() === state.passcode) {
    isUnlocked = true;
    localStorage.setItem('rsHub_unlocked', '1');
    render();
  } else {
    alert('Incorrect passcode.');
  }
}
function lock() {
  isUnlocked = false;
  localStorage.removeItem('rsHub_unlocked');
  if (activeSection === 'alumni') activeSection = 'schedule';
  render();
}
function changePasscode() {
  const newCode = prompt('Enter a new passcode (share this with current members only):');
  if (!newCode || !newCode.trim()) return;
  state.passcode = newCode.trim();
  reportSave(metaRef.set({ passcode: state.passcode }, { merge: true }));
}

/* ---------- Firestore sync ---------- */
const debounceTimers = {};
function debounceField(key, fn, delay = 500) {
  clearTimeout(debounceTimers[key]);
  debounceTimers[key] = setTimeout(fn, delay);
}
function flashSave(msg) {
  const el = document.getElementById('saveNote');
  if (!el) return;
  el.textContent = msg;
  clearTimeout(debounceTimers['__flash']);
  debounceTimers['__flash'] = setTimeout(() => {
    const e = document.getElementById('saveNote');
    if (e) e.textContent = '';
  }, 1800);
}
function reportSave(promise) {
  return promise.then(() => flashSave('Saved')).catch(() => flashSave('Could not save — try again'));
}

async function migrateIfNeeded() {
  try {
    const metaSnap = await metaRef.get();
    if (metaSnap.exists) {
      // Backfill passcode if missing from existing deployment
      if (!metaSnap.data().passcode) {
        metaRef.set({ passcode: 'ramstreet2026' }, { merge: true }).catch(() => {});
      }
      return;
    }
    const oldSnap = await legacyRef.get();
    const batch = db.batch();
    if (oldSnap.exists) {
      const old = oldSnap.data();
      batch.set(metaRef, {
        notice: old.notice || state.notice,
        members: (old.members && old.members.length) ? old.members : DEFAULT_MEMBERS.slice(),
        passcode: 'ramstreet2026'
      });
      (old.entries || []).forEach(e => { const { id, ...fields } = e; batch.set(entriesCol.doc(id), fields); });
      (old.docs || []).forEach(d => { const { id, ...fields } = d; batch.set(docsCol.doc(id), fields); });
      (old.references || []).forEach(r => { const { id, ...fields } = r; batch.set(referencesCol.doc(id), fields); });
    } else {
      batch.set(metaRef, { notice: state.notice, members: DEFAULT_MEMBERS.slice(), passcode: 'ramstreet2026' });
    }
    await batch.commit();
  } catch (err) { console.error('Migration error:', err); }
}

function subscribeCollections() {
  metaRef.onSnapshot((snap) => {
    if (snap.exists) {
      const d = snap.data();
      state.notice  = (d.notice !== undefined) ? d.notice : state.notice;
      state.members = (d.members && d.members.length) ? d.members : DEFAULT_MEMBERS.slice();
      state.passcode = d.passcode || 'ramstreet2026';
      state.standingMeeting = d.standingMeeting || { day: '', time: '', location: '', note: '' };
    }
    render();
  }, (err) => { console.error(err); flashSave('Could not connect — check your Firebase setup'); render(); });

  entriesCol.onSnapshot((snap) => {
    state.entries = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    render();
  }, (err) => console.error(err));

  docsCol.onSnapshot((snap) => {
    state.docs = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    render();
  }, (err) => console.error(err));

  referencesCol.onSnapshot((snap) => {
    state.references = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    render();
  }, (err) => console.error(err));

  alumniCol.onSnapshot((snap) => {
    state.alumni = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    render();
  }, (err) => console.error(err));

  eventsCol.onSnapshot((snap) => {
    state.events = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    render();
  }, (err) => console.error(err));
}

async function boot() {
  isUnlocked = localStorage.getItem('rsHub_unlocked') === '1';
  await migrateIfNeeded();
  subscribeCollections();
}

function setSection(section) { activeSection = section; render(); }

/* ---------- Roster ---------- */
function addMember() {
  const input = document.getElementById('newMemberInput');
  const name = input.value.trim();
  if (!name || state.members.includes(name)) { input.value = ''; return; }
  state.members.push(name);
  input.value = '';
  reportSave(metaRef.set({ members: state.members }, { merge: true })); render();
}
function removeMember(name) {
  if (!confirm(`Remove ${name} from the roster? They'll stop getting an automatic row each month.`)) return;
  state.members = state.members.filter(m => m !== name);
  reportSave(metaRef.set({ members: state.members }, { merge: true })); render();
}

/* ---------- Schedule entries ---------- */
function getMonthRows(monthKey) {
  const real = state.entries.filter(e => (e.month || monthKeyOf(e.due)) === monthKey);
  real.sort((a, b) => {
    if (!a.due && !b.due) return 0;
    if (!a.due) return 1; if (!b.due) return -1;
    return a.due.localeCompare(b.due);
  });
  const claimed = new Set(real.map(e => e.name));
  const placeholders = state.members.filter(m => !claimed.has(m)).map(m => ({
    id: `ph||${monthKey}||${m}`, name: m, topic: '', due: '', link: '', fileName: '', status: 'not_started', month: monthKey
  }));
  return real.concat(placeholders);
}
function getOrCreateEntry(id) {
  let e = state.entries.find(x => x.id === id);
  if (e) { if (!e.month) e.month = monthKeyOf(e.due) || activeMonth; return e; }
  if (id.startsWith('ph||')) {
    const parts = id.split('||');
    const monthKey = parts[1];
    const name = parts.slice(2).join('||');
    e = { id, name, topic: '', due: '', link: '', fileName: '', status: 'not_started', month: monthKey };
    state.entries.push(e);
    return e;
  }
  return null;
}
function saveEntry(e) {
  const { id, ...fields } = e;
  fields.updatedAt = firebase.firestore.FieldValue.serverTimestamp();
  reportSave(entriesCol.doc(id).set(fields, { merge: true }));
}
function addEntry() {
  const id = 's' + Date.now().toString(36);
  reportSave(entriesCol.doc(id).set({ name: '', topic: '', due: '', link: '', fileName: '', status: 'not_started', month: activeMonth, updatedAt: firebase.firestore.FieldValue.serverTimestamp() }));
}
function removeEntry(id) {
  if (id.startsWith('ph||')) return;
  if (!confirm('Remove this row? This can\'t be undone.')) return;
  const e = state.entries.find(e => e.id === id);
  if (e && e.fileName) db.collection('ramstreet-files').doc(id).delete().catch(() => {});
  entriesCol.doc(id).delete().catch(() => {});
}
function updateEntry(id, field, value) {
  const e = getOrCreateEntry(id);
  if (!e) return;
  e[field] = value;
  if (field === 'due' || field === 'status') { saveEntry(e); render(); }
  else { debounceField(id + ':' + field, () => saveEntry(e)); }
}
function clearDue(id) {
  const e = getOrCreateEntry(id);
  if (!e) return; e.due = '';
  saveEntry(e); render();
}
function clearLink(entryId) {
  const e = getOrCreateEntry(entryId);
  if (!e) return; e.link = '';
  saveEntry(e); render();
}
function promptLink(entryId) {
  const value = prompt('Paste a link to the article (Google Doc, Drive, etc.):');
  if (value === null) return;
  const e = getOrCreateEntry(entryId);
  if (!e) return;
  if (e.fileName) db.collection('ramstreet-files').doc(entryId).delete().catch(() => {});
  e.link = value.trim(); e.fileName = '';
  saveEntry(e); render();
}
function handleFileUpload(entryId, inputEl) {
  const file = inputEl.files && inputEl.files[0];
  if (!file) return;
  if (file.size > MAX_UPLOAD_BYTES) {
    alert(`That file is too big (${Math.round(file.size/1024)}KB). Files need to be under ${Math.round(MAX_UPLOAD_BYTES/1024)}KB — try "or link" for larger files.`);
    inputEl.value = ''; return;
  }
  const reader = new FileReader();
  reader.onload = async () => {
    const base64 = reader.result.slice(reader.result.indexOf(',') + 1);
    const mimeType = file.type || 'application/octet-stream';
    try {
      await db.collection('ramstreet-files').doc(entryId).set({ filename: file.name, mimeType, base64 });
      const e = getOrCreateEntry(entryId);
      if (e) { e.fileName = file.name; e.link = ''; saveEntry(e); }
      render();
    } catch (err) { alert('Upload failed — try again, or use "or link."'); }
  };
  reader.readAsDataURL(file);
}
async function downloadArticleFile(entryId, filename) {
  try {
    const snap = await db.collection('ramstreet-files').doc(entryId).get();
    if (!snap.exists) { alert('Could not find that file.'); return; }
    const { mimeType, base64 } = snap.data();
    const a = document.createElement('a');
    a.href = `data:${mimeType};base64,${base64}`; a.download = filename;
    document.body.appendChild(a); a.click(); a.remove();
  } catch (err) { alert('Could not open that file.'); }
}
async function removeArticleFile(entryId) {
  const e = getOrCreateEntry(entryId);
  if (!e) return;
  try { await db.collection('ramstreet-files').doc(entryId).delete(); } catch (err) {}
  e.fileName = '';
  saveEntry(e); render();
}

function eventDateBadge(dateStr) {
  if (!dateStr) return `<div class="event-date-badge"><div class="event-date-empty">No<br>date</div></div>`;
  const parts = dateStr.split('-');
  const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  const month = months[parseInt(parts[1], 10) - 1] || '';
  const day = parseInt(parts[2], 10);
  return `<div class="event-date-badge"><div class="event-date-month">${month}</div><div class="event-date-day">${day}</div></div>`;
}
function todayStr() {
  const now = new Date();
  return `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')}`;
}

/* ---------- Render: Schedule ---------- */
function renderScheduleBody() {
  const rows = getMonthRows(activeMonth);
  const monthInfo = MONTHS.find(m => m.key === activeMonth);
  const isReal = (id) => state.entries.some(e => e.id === id);

  const rowsHtml = rows.map((e, i) => {
    const meta = statusMeta(effectiveStatus(e));
    const statusSelect = `
      <select class="status-pill" style="background:${meta.bg};color:${meta.fg}" onchange="updateEntry('${e.id}','status',this.value)">
        ${STATUS_DEFS.map(s => `<option value="${s.key}" ${s.key === effectiveStatus(e) ? 'selected' : ''}>${s.label}</option>`).join('')}
      </select>`;
    let articleCell;
    if (e.fileName) {
      articleCell = `<div class="article-cell"><button class="file-chip" onclick="downloadArticleFile('${e.id}','${escAttr(escJs(e.fileName))}')">📄 ${escHtml(e.fileName)}</button><button class="chip-x" onclick="removeArticleFile('${e.id}')">×</button></div>`;
    } else if (e.link) {
      articleCell = `<div class="article-cell"><a class="file-chip link-chip" href="${escAttr(e.link)}" target="_blank" rel="noopener">🔗 View</a><button class="chip-x" onclick="promptLink('${e.id}')" title="Edit link">✎</button><button class="chip-x" onclick="clearLink('${e.id}')" title="Remove">×</button></div>`;
    } else {
      articleCell = `<div class="article-cell"><label class="upload-btn">Upload<input type="file" accept=".doc,.docx,.pdf,.txt" style="display:none" onchange="handleFileUpload('${e.id}', this)"></label><button class="chip-x link-alt" onclick="promptLink('${e.id}')">or link</button></div>`;
    }
    const delBtn = isReal(e.id) ? `<button class="del-btn" onclick="removeEntry('${e.id}')" title="Remove row">×</button>` : `<span></span>`;
    return `
      <div class="grid-row schedule entry">
        <div class="idx" title="${formatRelative(e.updatedAt)}">${i+1}</div>
        <div class="member-cell">${avatarHtml(e.name)}<span class="member-name-locked">${escHtml(e.name) || '—'}</span></div>
        <input value="${escAttr(e.topic)}" placeholder="Topic" oninput="updateEntry('${e.id}','topic',this.value)">
        <div class="due-cell"><input type="date" value="${e.due || ''}" onchange="updateEntry('${e.id}','due',this.value)">${e.due ? `<button class="chip-x" onclick="clearDue('${e.id}')" title="Clear date">×</button>` : ''}</div>
        ${articleCell}
        ${statusSelect}
        ${delBtn}
      </div>`;
  }).join('');

  return `
    <div class="page-header">
      <h1 class="page-title">${monthInfo.label} ${monthInfo.year}</h1>
      <div class="page-sub">${rows.length} members</div>
    </div>
    <div class="notice-wrap">
      <span class="notice-icon">📌</span>
      <textarea oninput="debounceUpdateNotice(this.value)">${escHtml(state.notice)}</textarea>
    </div>
    <div class="db-wrap">
      <div class="grid-row schedule head"><div></div><div>Member</div><div>Topic</div><div>Due date</div><div>Article</div><div>Status</div><div></div></div>
      ${rows.length ? rowsHtml : `<div class="empty-row">No members yet — add some on the Club Roster tab.</div>`}
      <div class="db-footer"><button class="add-btn" onclick="addEntry()">+ Add extra row</button></div>
    </div>`;
}

    .sort((a, b) => {
      if (!a.gradYear && !b.gradYear) return 0;
      if (!a.gradYear) return 1; if (!b.gradYear) return -1;
      return b.gradYear.localeCompare(a.gradYear);
    })
    .map((a, i) => {
      const linkedinCell = a.linkedin
        ? `<div style="display:flex;align-items:center;gap:4px;overflow:hidden"><a class="file-chip link-chip" href="${escAttr(a.linkedin.startsWith('http') ? a.linkedin : 'https://' + a.linkedin)}" target="_blank" rel="noopener" style="max-width:120px">🔗 LinkedIn</a><button class="chip-x" onclick="updateAlum('${a.id}','linkedin',''); saveAlumById('${a.id}')">×</button></div>`
        : `<input value="" placeholder="linkedin.com/in/…" oninput="updateAlum('${a.id}','linkedin',this.value)">`;
      return `
        <div class="grid-row alumni entry">
          <div class="idx" title="${formatRelative(a.updatedAt)}">${i+1}</div>
          <div class="member-cell">${avatarHtml(a.name)}<input value="${escAttr(a.name)}" placeholder="Full name" oninput="updateAlum('${a.id}','name',this.value)"></div>
          <input value="${escAttr(a.gradYear)}" placeholder="Year" oninput="updateAlum('${a.id}','gradYear',this.value)">
          <input value="${escAttr(a.company)}" placeholder="Company" oninput="updateAlum('${a.id}','company',this.value)">
          <input value="${escAttr(a.role)}" placeholder="Role / Title" oninput="updateAlum('${a.id}','role',this.value)">
          ${linkedinCell}
          <input value="${escAttr(a.email)}" placeholder="Email" oninput="updateAlum('${a.id}','email',this.value)">
          <button class="del-btn" onclick="removeAlum('${a.id}')" title="Remove">×</button>
        </div>`;
    }).join('');

  return `
    <div class="page-header">
      <h1 class="page-title">Alumni Network</h1>
      <div class="page-sub">${state.alumni.length} ${state.alumni.length === 1 ? 'alumnus' : 'alumni'} — visible to members only</div>
    </div>
    <div class="alumni-banner">
      🔒 This tab is only visible to people with the club passcode. Use it to stay connected with Ram Street grads.
    </div>
    <div class="db-wrap">
      <div class="grid-row alumni head"><div></div><div>Name</div><div>Year</div><div>Company</div><div>Role</div><div>LinkedIn</div><div>Email</div><div></div></div>
      ${state.alumni.length ? rows : `<div class="empty-row">No alumni added yet — add the first one below.</div>`}
      <div class="db-footer"><button class="add-btn" onclick="addAlum()">+ Add alumni</button></div>
    </div>`;
}

function saveAlumById(id) {
  const a = state.alumni.find(a => a.id === id);
  if (a) saveAlum(a);
  render();
}

/* ---------- Render: Events ---------- */
function renderEventsBody() {
  const sm = state.standingMeeting;
  const today = todayStr();

  const sorted = state.events.slice().sort((a, b) => {
    if (!a.date && !b.date) return 0;
    if (!a.date) return 1; if (!b.date) return -1;
    return a.date.localeCompare(b.date);
  });
  const upcoming = sorted.filter(e => !e.date || e.date >= today);
  const past     = sorted.filter(e => e.date && e.date < today).reverse();

  function eventCard(e) {
    const descHtml = e.description
      ? `<textarea class="event-desc-input auto-text" rows="1" placeholder="Description" oninput="updateEvent('${e.id}','description',this.value); autoResizeTextarea(this)">${escHtml(e.description)}</textarea>`
      : `<textarea class="event-desc-input auto-text" rows="1" placeholder="Description (optional)" oninput="updateEvent('${e.id}','description',this.value); autoResizeTextarea(this)"></textarea>`;
    const linkHtml = e.link
      ? `<input class="event-link-input" value="${escAttr(e.link)}" placeholder="Link (RSVP, Zoom, etc.)" oninput="updateEvent('${e.id}','link',this.value)">`
      : `<input class="event-link-input" value="" placeholder="Link (RSVP, Zoom, etc.)" oninput="updateEvent('${e.id}','link',this.value)">`;
    return `
      <div class="event-card" title="${formatRelative(e.updatedAt)}">
        ${eventDateBadge(e.date)}
        <div class="event-body">
          <input class="event-title-input" value="${escAttr(e.title)}" placeholder="Event title" oninput="updateEvent('${e.id}','title',this.value)">
          <div class="event-meta-row">
            <input class="event-meta-input" type="date" value="${e.date || ''}" onchange="updateEvent('${e.id}','date',this.value)">
            <input class="event-meta-input" value="${escAttr(e.time)}" placeholder="Time" oninput="updateEvent('${e.id}','time',this.value)">
            <input class="event-meta-input" value="${escAttr(e.location)}" placeholder="Location" oninput="updateEvent('${e.id}','location',this.value)">
          </div>
          ${descHtml}
          ${linkHtml}
        </div>
        <button class="del-btn" onclick="removeEvent('${e.id}')" title="Remove event">×</button>
      </div>`;
  }

  const upcomingHtml = upcoming.length
    ? upcoming.map(eventCard).join('')
    : `<div class="empty-row">No upcoming events — add one below.</div>`;

  const pastSection = past.length ? `
    <div class="events-section-label">Past</div>
    <div class="events-list" style="opacity:0.45">
      ${past.map(e => `
        <div class="event-card" title="${formatRelative(e.updatedAt)}">
          ${eventDateBadge(e.date)}
          <div class="event-body">
            <div style="font-size:14px;font-weight:600;color:var(--text);padding:2px 4px">${escHtml(e.title) || '—'}</div>
            <div class="event-meta-row" style="font-size:12px;color:var(--text-2);padding:2px 4px">
              ${e.time ? escHtml(e.time) : ''}${e.time && e.location ? ' · ' : ''}${e.location ? escHtml(e.location) : ''}
            </div>
          </div>
          <button class="del-btn" onclick="removeEvent('${e.id}')" title="Remove event">×</button>
        </div>`).join('')}
    </div>` : '';

  return `
    <div class="page-header">
      <h1 class="page-title">Meetings &amp; Events</h1>
      <div class="page-sub">${upcoming.length} upcoming</div>
    </div>

    <div class="standing-card">
      <div class="standing-header">
        <span class="standing-badge">Standing Meeting</span>
      </div>
      <div class="standing-fields">
        <div>
          <div class="standing-field-label">Day / Frequency</div>
          <input class="standing-input" value="${escAttr(sm.day)}" placeholder="Every Tuesday" oninput="updateStanding('day',this.value)">
        </div>
        <div>
          <div class="standing-field-label">Time</div>
          <input class="standing-input" value="${escAttr(sm.time)}" placeholder="7:00 PM" oninput="updateStanding('time',this.value)">
        </div>
        <div>
          <div class="standing-field-label">Location</div>
          <input class="standing-input" value="${escAttr(sm.location)}" placeholder="Room 204 or Zoom link" oninput="updateStanding('location',this.value)">
        </div>
        <div>
          <div class="standing-field-label">Note</div>
          <input class="standing-input" value="${escAttr(sm.note)}" placeholder="Optional note" oninput="updateStanding('note',this.value)">
        </div>
      </div>
    </div>

    <div class="events-section-label">Upcoming</div>
    <div class="events-list">${upcomingHtml}</div>
    <div class="db-footer"><button class="add-btn" onclick="addEvent()">+ Add event</button></div>

    ${pastSection}`;
}

/* ---------- Render ---------- */
function render() {
  document.body.classList.toggle('view-only', !isUnlocked);

  const monthChipsHtml = MONTHS.map(m => {
    const count = state.entries.filter(e => monthKeyOf(e.due) === m.key).length;
    return `<button class="month-chip ${m.key === activeMonth ? 'active' : ''}" onclick="setActiveMonth('${m.key}')">${m.label} '${String(m.year).slice(2)}${count ? `<span class="n">${count}</span>` : ''}</button>`;
  }).join('');

  const headerRight = isUnlocked
    ? `<div class="header-right">
        <div class="save-badge" id="saveNote"></div>
        <button class="header-btn" onclick="changePasscode()">Change passcode</button>
        <button class="header-btn" onclick="lock()">🔓 Lock</button>
       </div>`
    : `<div class="header-right">
        <button class="header-btn header-btn-unlock" onclick="unlockPrompt()">🔒 Unlock editing</button>
       </div>`;

  app.innerHTML = `
    <header class="site-header">
      <div class="site-logo">Ram Street <em>Hub</em></div>
      ${headerRight}
    </header>
    <div class="page-wrap">
      <div class="nav-tabs">
        <button class="nav-tab ${activeSection === 'schedule' ? 'active' : ''}" onclick="setSection('schedule')">Article Scheduling</button>
        <button class="nav-tab ${activeSection === 'docs' ? 'active' : ''}" onclick="setSection('docs')">Important Docs</button>
        <button class="nav-tab ${activeSection === 'references' ? 'active' : ''}" onclick="setSection('references')">References</button>
        <button class="nav-tab ${activeSection === 'roster' ? 'active' : ''}" onclick="setSection('roster')">Club Roster</button>
        <button class="nav-tab ${activeSection === 'events' ? 'active' : ''}" onclick="setSection('events')">Meetings &amp; Events</button>
        ${isUnlocked ? `<button class="nav-tab nav-tab-alumni ${activeSection === 'alumni' ? 'active' : ''}" onclick="setSection('alumni')">Alumni Network</button>` : ''}
      </div>
      ${activeSection === 'schedule' ? `<div class="month-bar">${monthChipsHtml}</div>` : ''}
      ${activeSection === 'schedule' ? renderScheduleBody()
        : activeSection === 'docs' ? renderDocsBody()
        : activeSection === 'references' ? renderReferencesBody()
        : activeSection === 'roster' ? renderRosterBody()
        : activeSection === 'events' ? renderEventsBody()
        : renderAlumniBody()}
    </div>`;
  document.querySelectorAll('.auto-text').forEach(autoResizeTextarea);
}

boot();
</script>
</body>
</html>
