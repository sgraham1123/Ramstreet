<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ram Street — Club Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<style>
  :root {
    --cream: #FBF8F1;
    --cream-dim: #F1ECDC;
    --green: #2E7D53;
    --green-deep: #1B4632;
    --green-pale: #E3F2E9;
    --sunshine: #FFC94D;
    --sunshine-pale: #FFF3D6;
    --coral: #FF6B6B;
    --coral-pale: #FFE3E1;
    --ink: #1E2A22;
    --gray-300: #DAD4C2;
    --gray-500: #8B8577;
    --white: #FFFFFF;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--cream);
    color: var(--ink);
    font-family: 'Inter', sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 980px; margin: 0 auto; padding: 28px 20px 70px; }

  /* Topbar */
  .topbar {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 18px;
  }
  .mascot { font-size: 30px; line-height: 1; }
  .brand { font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 24px; color: var(--green-deep); }
  .brand-sub { font-size: 12px; color: var(--gray-500); margin-top: -2px; }

  /* Nav pills */
  .nav-pills { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; }
  .pill-btn {
    font-family: 'Fredoka', sans-serif;
    font-weight: 600;
    font-size: 14px;
    border: none;
    border-radius: 999px;
    padding: 10px 18px;
    cursor: pointer;
    background: var(--white);
    color: var(--green-deep);
    border: 2px solid var(--green-pale);
  }
  .pill-btn:hover { border-color: var(--green); }
  .pill-btn.active { background: var(--green); color: var(--white); border-color: var(--green); }

  .month-pills {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
    background: var(--green-pale);
    border-radius: 16px;
    padding: 10px;
    margin-bottom: 18px;
  }
  .month-pill {
    font-family: 'Inter', sans-serif;
    font-weight: 600;
    font-size: 13px;
    border: none;
    border-radius: 999px;
    padding: 7px 13px;
    cursor: pointer;
    background: var(--white);
    color: var(--green-deep);
  }
  .month-pill:hover { background: var(--sunshine-pale); }
  .month-pill.active { background: var(--sunshine); color: var(--ink); }
  .month-pill .n { font-size: 11px; opacity: 0.65; margin-left: 4px; }

  /* Roster strip */
  .roster-strip {
    background: var(--white);
    border: 2px dashed var(--gray-300);
    border-radius: 14px;
    padding: 12px 14px;
    margin-bottom: 18px;
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
  }
  .roster-label { font-family: 'Fredoka', sans-serif; font-weight: 600; font-size: 13px; color: var(--green-deep); margin-right: 4px; }
  .roster-pill {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    background: var(--cream-dim);
    border-radius: 999px;
    padding: 4px 6px 4px 10px;
    font-size: 12px;
    font-weight: 500;
  }
  .roster-pill button {
    background: none; border: none; cursor: pointer; color: var(--gray-500); font-size: 13px; padding: 2px;
  }
  .roster-pill button:hover { color: var(--coral); }
  .add-member-input {
    border: 1.5px solid var(--gray-300);
    border-radius: 999px;
    padding: 6px 12px;
    font-size: 12px;
    font-family: 'Inter', sans-serif;
    outline: none;
    width: 150px;
  }
  .add-member-input:focus { border-color: var(--green); }
  .add-member-btn {
    background: var(--green);
    color: var(--white);
    border: none;
    border-radius: 999px;
    padding: 6px 12px;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
  }
  .add-member-btn:hover { background: var(--green-deep); }

  .main-header { margin-bottom: 14px; }
  .main-header h1 { font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 24px; margin: 0 0 2px; color: var(--green-deep); }
  .main-header .sub { font-size: 13px; color: var(--gray-500); }

  .notices {
    background: var(--sunshine-pale);
    border-radius: 14px;
    padding: 12px 16px;
    margin-bottom: 18px;
  }
  .notices textarea {
    width: 100%; border: none; background: transparent;
    font-family: 'Inter', sans-serif; font-size: 14px; line-height: 1.5; color: var(--ink);
    resize: vertical; min-height: 40px; outline: none;
  }

  /* Table */
  .table-wrap { background: var(--white); border-radius: 16px; overflow: hidden; box-shadow: 0 2px 14px rgba(30,42,34,0.06); }
  .grid-row { display: grid; align-items: center; }
  .grid-row.schedule { grid-template-columns: 26px 1.3fr 1.1fr 140px 1fr 130px 30px; }
  .grid-row.docs { grid-template-columns: 26px 1.3fr 1.6fr 30px; }
  .grid-row.references { grid-template-columns: 26px 1fr 1fr 1fr 1fr 30px; }
  .grid-row.head {
    background: var(--cream-dim);
    font-size: 11px;
    color: var(--gray-500);
    font-weight: 700;
    padding: 12px 14px;
  }
  .grid-row.entry { border-bottom: 1px solid var(--cream-dim); padding: 8px 14px; }
  .grid-row.entry:hover { background: #FDFBF6; }
  .grid-row.references.entry { align-items: start; padding-top: 10px; padding-bottom: 10px; }
  .grid-row .idx { font-size: 12px; color: var(--gray-500); }

  .member-cell { display: flex; align-items: center; gap: 8px; }
  .due-cell { display: flex; align-items: center; gap: 2px; position: relative; }
  .due-cell input { min-width: 0; }
  .due-cell input.due-empty { color: transparent; }
  .na-label {
    position: absolute; left: 6px; top: 50%; transform: translateY(-50%);
    font-size: 14px; color: var(--gray-500); font-family: 'Inter', sans-serif;
    pointer-events: none;
  }
  .avatar {
    flex-shrink: 0;
    width: 26px; height: 26px; border-radius: 999px;
    display: flex; align-items: center; justify-content: center;
    font-size: 11px; font-weight: 700; color: var(--white);
    font-family: 'Fredoka', sans-serif;
  }

  .grid-row input, .grid-row textarea {
    font-family: 'Inter', sans-serif; font-size: 14px; color: var(--ink);
    border: none; background: transparent; padding: 8px 6px; outline: none; width: 100%; border-radius: 8px;
  }
  .grid-row input:focus, .grid-row textarea:focus { background: var(--green-pale); }
  textarea.auto-text { resize: none; overflow: hidden; line-height: 1.45; min-height: 36px; white-space: pre-wrap; }

  .article-cell { display: flex; align-items: center; gap: 6px; overflow: hidden; }
  .upload-btn {
    font-family: 'Fredoka', sans-serif; font-size: 12px; font-weight: 600; color: var(--white);
    background: var(--green); padding: 7px 12px; border-radius: 999px; cursor: pointer; white-space: nowrap;
  }
  .upload-btn:hover { background: var(--green-deep); }
  .file-chip {
    font-family: 'Inter', sans-serif; font-size: 12px; font-weight: 600; color: var(--ink);
    background: var(--cream-dim); border: none; padding: 7px 10px; border-radius: 999px; cursor: pointer;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 150px; text-decoration: none; display: inline-block;
  }
  .file-chip.link-chip { color: var(--green); background: var(--green-pale); }
  .chip-x { background: none; border: none; color: var(--gray-500); font-size: 13px; cursor: pointer; padding: 2px 4px; flex-shrink: 0; }
  .chip-x:hover { color: var(--coral); }
  .chip-x.link-alt { font-size: 11px; text-decoration: underline; white-space: nowrap; }

  .status-pill {
    font-family: 'Fredoka', sans-serif; font-size: 12px; font-weight: 600;
    padding: 6px 10px; border-radius: 999px; border: none; cursor: pointer; white-space: nowrap;
    appearance: none; -webkit-appearance: none; -moz-appearance: none;
    background-repeat: no-repeat; background-position: right 8px center; background-size: 10px;
  }
  .status-pill option { color: #1E2A22; background: #FFFFFF; font-family: 'Inter', sans-serif; }

  .del-btn { background: none; border: none; color: var(--gray-300); font-size: 17px; cursor: pointer; padding: 4px; }
  .del-btn:hover { color: var(--coral); }

  .empty-row { padding: 30px 0; text-align: center; color: var(--gray-500); font-size: 13px; }
  .add-row { padding: 12px 14px; }
  .add-btn {
    background: var(--cream-dim); border: none; color: var(--green-deep);
    font-family: 'Fredoka', sans-serif; font-size: 13px; font-weight: 600;
    cursor: pointer; padding: 8px 16px; border-radius: 999px;
  }
  .add-btn:hover { background: var(--green-pale); }

  .save-note { font-size: 11px; color: var(--gray-500); margin-top: 10px; min-height: 14px; }
  .loading { text-align: center; padding: 100px 0; color: var(--gray-500); font-size: 13px; }

  @media (max-width: 820px) {
    .grid-row.schedule { grid-template-columns: 20px 1fr 1fr 100px 90px 100px 24px; font-size: 12px; }
    .grid-row.docs { grid-template-columns: 18px 1fr 1fr 24px; font-size: 12px; }
    .grid-row.references { grid-template-columns: 18px 1fr 1fr 1fr 1fr 24px; font-size: 12px; }
  }
</style>
</head>
<body>
<div class="wrap" id="app">
  <div class="loading">Loading…</div>
</div>

<script>
// ===== FIREBASE CONFIG =====
const firebaseConfig = {
  apiKey: "AIzaSyBbt0q-wjdsKQ9eS0wjJWC7eBvDBhQvx4k",
  authDomain: "ramstreet-c2350.firebaseapp.com",
  projectId: "ramstreet-c2350",
  storageBucket: "ramstreet-c2350.firebasestorage.app",
  messagingSenderId: "450707565730",
  appId: "1:450707565730:web:3638ca27fd0788899c3bfb"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
const metaRef = db.collection('ramstreet-meta').doc('main');
const entriesCol = db.collection('ramstreet-entries');
const docsCol = db.collection('ramstreet-docs-tab');
const referencesCol = db.collection('ramstreet-references');
const legacyRef = db.collection('ramstreet').doc('schedule-data'); // old combined doc, read once for migration only

const MAX_UPLOAD_BYTES = 350 * 1024;

const AVATAR_COLORS = ['#2E7D53', '#E0A400', '#FF6B6B', '#4C8DA6', '#8B6FB3', '#D9709A'];

const DEFAULT_MEMBERS = [
  "Conner Pietrangelo","Charlie Green","Jacob Gaer","Sophia Paul","Chris Terringo",
  "Hunter Folga","Natalie Sarff","Paytyn Newton","Raymond Kappel","Tim Kervin",
  "Robert Duquette","Spencer Graham","Michael Melander","Hunter Stewart","Hollis Costa",
  "Madison Lehman","Celine Jamnik","Emma Winters"
];

const MONTHS = [
  { key: '2026-09', label: 'Sep', year: 2026 },
  { key: '2026-10', label: 'Oct', year: 2026 },
  { key: '2026-11', label: 'Nov', year: 2026 },
  { key: '2026-12', label: 'Dec', year: 2026 },
  { key: '2027-01', label: 'Jan', year: 2027 },
  { key: '2027-02', label: 'Feb', year: 2027 },
  { key: '2027-03', label: 'Mar', year: 2027 },
  { key: '2027-04', label: 'Apr', year: 2027 },
  { key: '2027-05', label: 'May', year: 2027 },
];

let state = {
  notice: 'Welcome! Add your topic, due date, and article link below.',
  members: DEFAULT_MEMBERS.slice(),
  entries: [],
  docs: [],
  references: []
};
let activeSection = 'schedule';
let activeMonth = defaultMonth();

const app = document.getElementById('app');

function defaultMonth() {
  const now = new Date();
  const key = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}`;
  return MONTHS.find(m => m.key === key) ? key : MONTHS[0].key;
}
function monthKeyOf(dueStr) { return dueStr ? dueStr.slice(0, 7) : null; }
function escAttr(str) { return (str || '').replace(/"/g, '&quot;'); }
function escHtml(str) { const d = document.createElement('div'); d.textContent = str || ''; return d.innerHTML; }
function autoResizeTextarea(el) { el.style.height = 'auto'; el.style.height = el.scrollHeight + 'px'; }

function initials(name) {
  const parts = (name || '').trim().split(/\s+/).filter(Boolean);
  if (!parts.length) return '?';
  const first = parts[0][0] || '';
  const last = parts.length > 1 ? parts[parts.length - 1][0] : '';
  return (first + last).toUpperCase();
}
function avatarColorFor(name) {
  if (!name) return '#DAD4C2';
  let hash = 0;
  for (let i = 0; i < name.length; i++) hash = (hash * 31 + name.charCodeAt(i)) % 997;
  return AVATAR_COLORS[Math.abs(hash) % AVATAR_COLORS.length];
}
function avatarHtml(name) {
  return `<span class="avatar" style="background:${avatarColorFor(name)}">${escHtml(initials(name))}</span>`;
}

const STATUS_DEFS = [
  { key: 'not_started', label: 'Not Started', emoji: '⚪', bg: '#EDE9DC', fg: '#5A5647' },
  { key: 'in_progress', label: 'In Progress', emoji: '🟡', bg: '#FFC94D', fg: '#3A2E00' },
  { key: 'done_writing', label: 'Done Writing', emoji: '🟠', bg: '#FF9F5B', fg: '#3A2200' },
  { key: 'editing', label: 'Editing', emoji: '🔵', bg: '#4C8DA6', fg: '#FFFFFF' },
  { key: 'published', label: 'Published', emoji: '🟢', bg: '#2E7D53', fg: '#FFFFFF' },
];
function statusMeta(key) { return STATUS_DEFS.find(s => s.key === key) || STATUS_DEFS[0]; }
function effectiveStatus(e) { return e.status || (e.posted ? 'published' : 'not_started'); }

/* ---------- Firestore sync (one document per row — no more whole-document overwrites) ---------- */
const debounceTimers = {};
function debounceField(key, fn, delay = 500) {
  clearTimeout(debounceTimers[key]);
  debounceTimers[key] = setTimeout(fn, delay);
}
function flashSave(msg) {
  const el = document.getElementById('saveNote');
  if (!el) return;
  el.textContent = msg;
  clearTimeout(debounceTimers['__flash']);
  debounceTimers['__flash'] = setTimeout(() => { if (el) el.textContent = ''; }, 1800);
}
function reportSave(promise) {
  return promise.then(() => flashSave('Saved')).catch(() => flashSave('Could not save — try again'));
}

async function migrateIfNeeded() {
  try {
    const metaSnap = await metaRef.get();
    if (metaSnap.exists) return;
    const oldSnap = await legacyRef.get();
    const batch = db.batch();
    if (oldSnap.exists) {
      const old = oldSnap.data();
      batch.set(metaRef, {
        notice: old.notice || state.notice,
        members: (old.members && old.members.length) ? old.members : DEFAULT_MEMBERS.slice()
      });
      (old.entries || []).forEach(e => { const { id, ...fields } = e; batch.set(entriesCol.doc(id), fields); });
      (old.docs || []).forEach(d => { const { id, ...fields } = d; batch.set(docsCol.doc(id), fields); });
      (old.references || []).forEach(r => { const { id, ...fields } = r; batch.set(referencesCol.doc(id), fields); });
    } else {
      batch.set(metaRef, { notice: state.notice, members: DEFAULT_MEMBERS.slice() });
    }
    await batch.commit();
  } catch (err) { console.error('Migration error:', err); }
}

function subscribeCollections() {
  metaRef.onSnapshot((snap) => {
    if (snap.exists) {
      const d = snap.data();
      state.notice = (d.notice !== undefined) ? d.notice : state.notice;
      state.members = (d.members && d.members.length) ? d.members : DEFAULT_MEMBERS.slice();
    }
    render();
  }, (err) => { console.error(err); flashSave('Could not connect — check your Firebase setup'); render(); });

  entriesCol.onSnapshot((snap) => {
    state.entries = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    render();
  }, (err) => console.error(err));

  docsCol.onSnapshot((snap) => {
    state.docs = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    render();
  }, (err) => console.error(err));

  referencesCol.onSnapshot((snap) => {
    state.references = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    render();
  }, (err) => console.error(err));
}

async function boot() {
  await migrateIfNeeded();
  subscribeCollections();
}

function setSection(section) { activeSection = section; render(); }
function setActiveMonth(key) { activeMonth = key; render(); }

/* ---------- Roster (kept as one small doc — infrequent edits, low conflict risk) ---------- */
function addMember() {
  const input = document.getElementById('newMemberInput');
  const name = input.value.trim();
  if (!name || state.members.includes(name)) { input.value = ''; return; }
  state.members.push(name);
  input.value = '';
  reportSave(metaRef.set({ members: state.members }, { merge: true })); render();
}
function removeMember(name) {
  state.members = state.members.filter(m => m !== name);
  reportSave(metaRef.set({ members: state.members }, { merge: true })); render();
}

/* ---------- Schedule entries (roster-backed) ---------- */
function getMonthRows(monthKey) {
  const real = state.entries.filter(e => (e.month || monthKeyOf(e.due)) === monthKey);
  real.sort((a, b) => {
    if (!a.due && !b.due) return 0;
    if (!a.due) return 1;
    if (!b.due) return -1;
    return a.due.localeCompare(b.due);
  });
  const claimed = new Set(real.map(e => e.name));
  const placeholders = state.members.filter(m => !claimed.has(m)).map(m => ({
    id: `ph||${monthKey}||${m}`, name: m, topic: '', due: '', link: '', fileName: '', status: 'not_started', month: monthKey
  }));
  return real.concat(placeholders);
}
function getOrCreateEntry(id) {
  let e = state.entries.find(x => x.id === id);
  if (e) { if (!e.month) e.month = monthKeyOf(e.due) || activeMonth; return e; }
  if (id.startsWith('ph||')) {
    const parts = id.split('||');
    const monthKey = parts[1];
    const name = parts.slice(2).join('||');
    e = { id, name, topic: '', due: '', link: '', fileName: '', status: 'not_started', month: monthKey };
    state.entries.push(e);
    return e;
  }
  return null;
}
function saveEntry(e) {
  const { id, ...fields } = e;
  reportSave(entriesCol.doc(id).set(fields, { merge: true }));
}
function addEntry() {
  const id = 's' + Date.now().toString(36);
  reportSave(entriesCol.doc(id).set({ name: '', topic: '', due: '', link: '', fileName: '', status: 'not_started', month: activeMonth }));
}
function removeEntry(id) {
  if (id.startsWith('ph||')) return;
  const e = state.entries.find(e => e.id === id);
  if (e && e.fileName) db.collection('ramstreet-files').doc(id).delete().catch(() => {});
  entriesCol.doc(id).delete().catch(() => {});
}
function updateEntry(id, field, value) {
  const e = getOrCreateEntry(id);
  if (!e) return;
  e[field] = value;
  if (field === 'due' || field === 'status') { saveEntry(e); render(); }
  else { debounceField(id + ':' + field, () => saveEntry(e)); }
}
function clearDue(id) {
  const e = getOrCreateEntry(id);
  if (!e) return;
  e.due = '';
  saveEntry(e); render();
}
function clearLink(entryId) {
  const e = getOrCreateEntry(entryId);
  if (!e) return;
  e.link = '';
  saveEntry(e); render();
}
function promptLink(entryId) {
  const value = prompt('Paste a link to the article (Google Doc, Drive, etc.):');
  if (value === null) return;
  const e = getOrCreateEntry(entryId);
  if (!e) return;
  if (e.fileName) db.collection('ramstreet-files').doc(entryId).delete().catch(() => {});
  e.link = value.trim();
  e.fileName = '';
  saveEntry(e); render();
}
function handleFileUpload(entryId, inputEl) {
  const file = inputEl.files && inputEl.files[0];
  if (!file) return;
  if (file.size > MAX_UPLOAD_BYTES) {
    alert(`That file is too big (${Math.round(file.size/1024)}KB). Files need to be under ${Math.round(MAX_UPLOAD_BYTES/1024)}KB — try "or link" for larger files.`);
    inputEl.value = ''; return;
  }
  const reader = new FileReader();
  reader.onload = async () => {
    const base64 = reader.result.slice(reader.result.indexOf(',') + 1);
    const mimeType = file.type || 'application/octet-stream';
    try {
      await db.collection('ramstreet-files').doc(entryId).set({ filename: file.name, mimeType, base64 });
      const e = getOrCreateEntry(entryId);
      if (e) { e.fileName = file.name; e.link = ''; saveEntry(e); }
      render();
    } catch (err) { alert('Upload failed — try again, or use "or link."'); }
  };
  reader.readAsDataURL(file);
}
async function downloadArticleFile(entryId, filename) {
  try {
    const snap = await db.collection('ramstreet-files').doc(entryId).get();
    if (!snap.exists) { alert('Could not find that file.'); return; }
    const { mimeType, base64 } = snap.data();
    const a = document.createElement('a');
    a.href = `data:${mimeType};base64,${base64}`; a.download = filename;
    document.body.appendChild(a); a.click(); a.remove();
  } catch (err) { alert('Could not open that file.'); }
}
async function removeArticleFile(entryId) {
  const e = getOrCreateEntry(entryId);
  if (!e) return;
  try { await db.collection('ramstreet-files').doc(entryId).delete(); } catch (err) {}
  e.fileName = '';
  saveEntry(e); render();
}

/* ---------- Important Docs (with same upload pattern) ---------- */
function saveDoc(d) {
  const { id, ...fields } = d;
  reportSave(docsCol.doc(id).set(fields, { merge: true }));
}
function addDoc() {
  const id = 'd' + Date.now().toString(36);
  reportSave(docsCol.doc(id).set({ member: '', link: '', fileName: '' }));
}
function removeDoc(id) {
  const d = state.docs.find(d => d.id === id);
  if (d && d.fileName) db.collection('ramstreet-docfiles').doc(id).delete().catch(() => {});
  docsCol.doc(id).delete().catch(() => {});
}
function updateDoc(id, field, value) {
  const d = state.docs.find(d => d.id === id);
  if (!d) return;
  d[field] = value;
  debounceField(id + ':' + field, () => saveDoc(d));
}
function clearDocLink(id) {
  const d = state.docs.find(d => d.id === id);
  if (!d) return;
  d.link = '';
  saveDoc(d); render();
}
function promptDocLink(id) {
  const value = prompt('Paste a link to the document (Google Doc, Drive, etc.):');
  if (value === null) return;
  const d = state.docs.find(d => d.id === id);
  if (!d) return;
  if (d.fileName) db.collection('ramstreet-docfiles').doc(id).delete().catch(() => {});
  d.link = value.trim(); d.fileName = '';
  saveDoc(d); render();
}
function handleDocFileUpload(id, inputEl) {
  const file = inputEl.files && inputEl.files[0];
  if (!file) return;
  if (file.size > MAX_UPLOAD_BYTES) {
    alert(`That file is too big (${Math.round(file.size/1024)}KB). Files need to be under ${Math.round(MAX_UPLOAD_BYTES/1024)}KB — try "or link" for larger files.`);
    inputEl.value = ''; return;
  }
  const reader = new FileReader();
  reader.onload = async () => {
    const base64 = reader.result.slice(reader.result.indexOf(',') + 1);
    const mimeType = file.type || 'application/octet-stream';
    try {
      await db.collection('ramstreet-docfiles').doc(id).set({ filename: file.name, mimeType, base64 });
      const d = state.docs.find(d => d.id === id);
      if (d) { d.fileName = file.name; d.link = ''; saveDoc(d); }
      render();
    } catch (err) { alert('Upload failed — try again, or use "or link."'); }
  };
  reader.readAsDataURL(file);
}
async function downloadDocFile(id, filename) {
  try {
    const snap = await db.collection('ramstreet-docfiles').doc(id).get();
    if (!snap.exists) { alert('Could not find that file.'); return; }
    const { mimeType, base64 } = snap.data();
    const a = document.createElement('a');
    a.href = `data:${mimeType};base64,${base64}`; a.download = filename;
    document.body.appendChild(a); a.click(); a.remove();
  } catch (err) { alert('Could not open that file.'); }
}
async function removeDocFile(id) {
  const d = state.docs.find(d => d.id === id);
  if (!d) return;
  try { await db.collection('ramstreet-docfiles').doc(id).delete(); } catch (err) {}
  d.fileName = '';
  saveDoc(d); render();
}

/* ---------- References ---------- */
function saveReference(r) {
  const { id, ...fields } = r;
  reportSave(referencesCol.doc(id).set(fields, { merge: true }));
}
function addReference() {
  const id = 'r' + Date.now().toString(36);
  reportSave(referencesCol.doc(id).set({ member: '', contactName: '', contactInfo: '', contactEmail: '' }));
}
function removeReference(id) { referencesCol.doc(id).delete().catch(() => {}); }
function updateReference(id, field, value) {
  const r = state.references.find(r => r.id === id);
  if (!r) return;
  r[field] = value;
  debounceField(id + ':' + field, () => saveReference(r));
}

function debounceUpdateNotice(value) {
  state.notice = value;
  debounceField('notice', () => reportSave(metaRef.set({ notice: state.notice }, { merge: true })));
}

/* ---------- Render: Schedule ---------- */
function renderScheduleBody() {
  const rows = getMonthRows(activeMonth);
  const monthInfo = MONTHS.find(m => m.key === activeMonth);
  const isReal = (id) => state.entries.some(e => e.id === id);

  const rowsHtml = rows.map((e, i) => {
    const meta = statusMeta(effectiveStatus(e));
    const statusSelect = `
      <select class="status-pill" style="background:${meta.bg};color:${meta.fg}" onchange="updateEntry('${e.id}','status',this.value)">
        ${STATUS_DEFS.map(s => `<option value="${s.key}" ${s.key === effectiveStatus(e) ? 'selected' : ''}>${s.emoji} ${s.label}</option>`).join('')}
      </select>`;
    let articleCell;
    if (e.fileName) {
      articleCell = `<div class="article-cell"><button class="file-chip" onclick="downloadArticleFile('${e.id}','${escAttr(e.fileName)}')">📄 ${escHtml(e.fileName)}</button><button class="chip-x" onclick="removeArticleFile('${e.id}')">×</button></div>`;
    } else if (e.link) {
      articleCell = `<div class="article-cell"><a class="file-chip link-chip" href="${escAttr(e.link)}" target="_blank" rel="noopener">🔗 View link</a><button class="chip-x" onclick="promptLink('${e.id}')" title="Edit link">✎</button><button class="chip-x" onclick="clearLink('${e.id}')" title="Remove link">×</button></div>`;
    } else {
      articleCell = `<div class="article-cell"><label class="upload-btn">Upload<input type="file" accept=".doc,.docx,.pdf,.txt" style="display:none" onchange="handleFileUpload('${e.id}', this)"></label><button class="chip-x link-alt" onclick="promptLink('${e.id}')">or link</button></div>`;
    }
    const delBtn = isReal(e.id) ? `<button class="del-btn" onclick="removeEntry('${e.id}')" title="Remove row">×</button>` : `<span></span>`;
    return `
      <div class="grid-row schedule entry">
        <div class="idx">${i + 1}</div>
        <div class="member-cell">${avatarHtml(e.name)}<input value="${escAttr(e.name)}" placeholder="Member name" oninput="updateEntry('${e.id}','name',this.value)"></div>
        <input value="${escAttr(e.topic)}" placeholder="Topic" oninput="updateEntry('${e.id}','topic',this.value)">
        <div class="due-cell"><input type="date" value="${e.due || ''}" class="${e.due ? '' : 'due-empty'}" onchange="updateEntry('${e.id}','due',this.value)">${e.due ? `<button class="chip-x" onclick="clearDue('${e.id}')" title="No article due at the moment">×</button>` : `<span class="na-label">N/A</span>`}</div>
        ${articleCell}
        ${statusSelect}
        ${delBtn}
      </div>`;
  }).join('');

  return `
    <div class="main-header">
      <h1>${monthInfo.label} ${monthInfo.year}</h1>
      <div class="sub">${rows.length} club members shown</div>
    </div>
    <div class="notices"><textarea oninput="debounceUpdateNotice(this.value)">${state.notice}</textarea></div>
    <div class="table-wrap">
      <div class="grid-row schedule head"><div></div><div>Member</div><div>Topic</div><div>Due date</div><div>Article</div><div>Status</div><div></div></div>
      ${rows.length ? rowsHtml : `<div class="empty-row">No members yet — add some on the Club Roster tab.</div>`}
      <div class="add-row"><button class="add-btn" onclick="addEntry()">+ Add extra row</button></div>
    </div>
    <div class="save-note" id="saveNote"></div>
  `;
}

/* ---------- Render: Docs ---------- */
function renderDocsBody() {
  const rows = state.docs.map((d, i) => {
    let cell;
    if (d.fileName) {
      cell = `<div class="article-cell"><button class="file-chip" onclick="downloadDocFile('${d.id}','${escAttr(d.fileName)}')">📄 ${escHtml(d.fileName)}</button><button class="chip-x" onclick="removeDocFile('${d.id}')">×</button></div>`;
    } else if (d.link) {
      cell = `<div class="article-cell"><a class="file-chip link-chip" href="${escAttr(d.link)}" target="_blank" rel="noopener">🔗 View link</a><button class="chip-x" onclick="promptDocLink('${d.id}')" title="Edit link">✎</button><button class="chip-x" onclick="clearDocLink('${d.id}')" title="Remove link">×</button></div>`;
    } else {
      cell = `<div class="article-cell"><label class="upload-btn">Upload<input type="file" accept=".doc,.docx,.pdf,.txt" style="display:none" onchange="handleDocFileUpload('${d.id}', this)"></label><button class="chip-x link-alt" onclick="promptDocLink('${d.id}')">or link</button></div>`;
    }
    return `
      <div class="grid-row docs entry">
        <div class="idx">${i + 1}</div>
        <div class="member-cell">${avatarHtml(d.member)}<input value="${escAttr(d.member)}" placeholder="Member name" oninput="updateDoc('${d.id}','member',this.value)"></div>
        ${cell}
        <button class="del-btn" onclick="removeDoc('${d.id}')" title="Remove row">×</button>
      </div>`;
  }).join('');

  return `
    <div class="main-header"><h1>Important Docs</h1><div class="sub">${state.docs.length} ${state.docs.length===1?'document':'documents'} linked</div></div>
    <div class="table-wrap">
      <div class="grid-row docs head"><div></div><div>Member name</div><div>File</div><div></div></div>
      ${state.docs.length ? rows : `<div class="empty-row">No documents added yet.</div>`}
      <div class="add-row"><button class="add-btn" onclick="addDoc()">+ Add document</button></div>
    </div>
    <div class="save-note" id="saveNote"></div>
  `;
}

/* ---------- Render: References ---------- */
function renderReferencesBody() {
  const rows = state.references.map((r, i) => `
    <div class="grid-row references entry">
      <div class="idx">${i + 1}</div>
      <div class="member-cell">${avatarHtml(r.member)}<input value="${escAttr(r.member)}" placeholder="Member name" oninput="updateReference('${r.id}','member',this.value)"></div>
      <input value="${escAttr(r.contactName)}" placeholder="Contact name" oninput="updateReference('${r.id}','contactName',this.value)">
      <textarea class="auto-text" rows="1" placeholder="Contact information" oninput="updateReference('${r.id}','contactInfo',this.value); autoResizeTextarea(this)">${escHtml(r.contactInfo)}</textarea>
      <input value="${escAttr(r.contactEmail)}" placeholder="Contact email" oninput="updateReference('${r.id}','contactEmail',this.value)">
      <button class="del-btn" onclick="removeReference('${r.id}')" title="Remove row">×</button>
    </div>`).join('');

  return `
    <div class="main-header"><h1>References</h1><div class="sub">${state.references.length} ${state.references.length===1?'contact':'contacts'} listed</div></div>
    <div class="table-wrap">
      <div class="grid-row references head"><div></div><div>Member name</div><div>Contact name</div><div>Contact information</div><div>Contact email</div><div></div></div>
      ${state.references.length ? rows : `<div class="empty-row">No references added yet.</div>`}
      <div class="add-row"><button class="add-btn" onclick="addReference()">+ Add reference</button></div>
    </div>
    <div class="save-note" id="saveNote"></div>
  `;
}

/* ---------- Top-level render ---------- */
/* ---------- Render: Club Roster ---------- */
function renderRosterBody() {
  const rosterPills = state.members.map(m => `
    <span class="roster-pill">${escHtml(m)}<button onclick="removeMember('${escAttr(m)}')" title="Remove from roster">×</button></span>
  `).join('');

  return `
    <div class="main-header">
      <h1>Club Roster</h1>
      <div class="sub">${state.members.length} members — everyone here gets a row on the Article Scheduling tab automatically</div>
    </div>
    <div class="roster-strip">
      ${rosterPills || `<span class="sub">No members yet.</span>`}
      <input id="newMemberInput" class="add-member-input" placeholder="Add member…" onkeydown="if(event.key==='Enter')addMember()">
      <button class="add-member-btn" onclick="addMember()">+ Add</button>
    </div>
    <button class="pill-btn" onclick="setSection('schedule')" style="margin-top:16px;">→ Go to Article Scheduling</button>
  `;
}

function render() {
  const monthPillsHtml = MONTHS.map(m => {
    const count = state.entries.filter(e => monthKeyOf(e.due) === m.key).length;
    return `<button class="month-pill ${m.key === activeMonth ? 'active' : ''}" onclick="setActiveMonth('${m.key}')">${m.label} '${String(m.year).slice(2)}${count ? `<span class="n">${count}</span>` : ''}</button>`;
  }).join('');

  app.innerHTML = `
    <div class="topbar">
      <span class="mascot">🐏</span>
      <div><div class="brand">Ram Street</div><div class="brand-sub">Club Hub</div></div>
    </div>
    <div class="nav-pills">
      <button class="pill-btn ${activeSection === 'schedule' ? 'active' : ''}" onclick="setSection('schedule')">Article Scheduling</button>
      <button class="pill-btn ${activeSection === 'docs' ? 'active' : ''}" onclick="setSection('docs')">Important Docs</button>
      <button class="pill-btn ${activeSection === 'references' ? 'active' : ''}" onclick="setSection('references')">References</button>
      <button class="pill-btn ${activeSection === 'roster' ? 'active' : ''}" onclick="setSection('roster')">Club Roster</button>
    </div>
    ${activeSection === 'schedule' ? `<div class="month-pills">${monthPillsHtml}</div>` : ''}
    ${activeSection === 'schedule' ? renderScheduleBody() : activeSection === 'docs' ? renderDocsBody() : activeSection === 'references' ? renderReferencesBody() : renderRosterBody()}
  `;
  document.querySelectorAll('.auto-text').forEach(autoResizeTextarea);
}

boot();
</script>
</body>
</html>
